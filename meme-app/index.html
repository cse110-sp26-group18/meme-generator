<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Luckiest+Guy&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <!-- Legacy header back button — kept in DOM so existing test selectors
         don't break, but hidden permanently on mobile (the editor IS the
         default mobile view now, so there is no editor-back direction). -->
    <button
      type="button"
      id="mobile-back-btn"
      class="mobile-back-btn"
      aria-label="Back to home"
      hidden
    >←</button>
    <button
      type="button"
      id="search-icon-btn"
      class="search-icon-btn"
      aria-label="Open meme template search"
      aria-controls="meme-search"
      aria-expanded="false"
    >🔍</button>
    <h1>Meme Generator</h1>
    <!-- Settings gear (Screen 13). Inert in this version; behavior TBD. -->
    <button
      type="button"
      id="settings-btn"
      class="settings-btn"
      aria-label="Settings (coming soon)"
      aria-disabled="true"
      title="Settings coming soon"
    >⚙</button>
  </header>

  <main>
    <!-- Top action row — kept for desktop. On mobile the new design
         (Screen 13) hides this row entirely; Share lives at the bottom
         and uploads happen via tap-canvas / drag-drop / the + in the
         Browse Memes overlay. -->
    <div class="controls">
      <label class="upload-btn">
        Upload
        <input type="file" id="image-input" accept="image/*" hidden>
      </label>
      <button id="download-btn" disabled>Download Meme</button>
    </div>

    <div id="canvas-container" class="canvas-container">
      <canvas id="meme-canvas"></canvas>
      <div class="placeholder" id="placeholder">Click here or drag &amp; drop an image to get started</div>
    </div>

    <!-- "fonts" discovery affordance (Screen 13). Anchored to the right
         just below the canvas. Click reveals/focuses the existing per-text-box
         font dropdown if a text box is selected; otherwise shows a hint. -->
    <div class="fonts-row">
      <button type="button" id="fonts-btn" class="fonts-btn">fonts</button>
    </div>

    <!-- Scan Text — future OCR affordance. Inert in this version (no
         click handler, native disabled, aria-disabled). Hidden on mobile
         per the new design; still visible on desktop. -->
    <div class="scan-text-row">
      <button
        type="button"
        id="scan-text-btn"
        disabled
        aria-disabled="true"
        title="Scan Text coming soon"
      >Scan Text</button>
    </div>

    <p class="hint" id="hint" hidden>Click on the image to add text</p>

    <!-- Bottom action row (Screen 13). Mobile-primary place for Browse
         Memes and Share. Desktop hides this row because Upload/Share/
         Download already live in the top .controls. -->
    <div class="bottom-actions">
      <button type="button" id="browse-memes-btn" class="browse-memes-btn">Browse Memes</button>
      <button type="button" id="share-btn" disabled>Share</button>
    </div>

    <!-- Meme search section — on mobile this IS the home/search page
         (full-screen dark forest panel per Screen 11 / Screen 12); on
         desktop it remains an inline section below the editor. The IDs
         on input / results / status stay unchanged so MemeSearch.js wires
         up the same way it always has. -->
    <section class="meme-search" id="meme-search" aria-label="Meme search">
      <!-- Top-left close-browse affordance shown inside the browse overlay.
           Returns to the editor view without selecting a meme. -->
      <button
        type="button"
        id="mobile-home-back-btn"
        class="mobile-home-back-btn"
        aria-label="Close browse memes"
      >←</button>
      <h2 class="meme-search-title">Meme Generator</h2>
      <p id="meme-search-status" class="meme-search-status" role="status" aria-live="polite"></p>
      <div id="meme-search-results" class="meme-search-results"></div>
      <!-- Bottom row anchored at the foot of the home view: search input on
           the left, circular + upload button on the right. The + reuses
           the existing #image-input file picker. -->
      <div class="meme-search-bottom-row">
        <input
          type="text"
          id="meme-search-input"
          class="meme-search-input"
          placeholder="Search"
          autocomplete="off"
        >
        <button
          type="button"
          id="mobile-home-plus-btn"
          class="mobile-home-plus-btn"
          aria-label="Upload an image"
        >+</button>
      </div>
    </section>
  </main>

  <script src="js/ImageLoader.js"></script>
  <script src="js/TextBox.js"></script>
  <script src="js/DragResize.js"></script>
  <script src="js/TextBoxManager.js"></script>
  <script src="js/Exporter.js"></script>
  <script src="js/MemeSearch.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
