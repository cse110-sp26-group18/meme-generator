<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Apply theme synchronously before the body paints, so dark-mode users
       don't see a flash of light theme on first load (FOUC). The full
       ThemeToggle module re-applies this on DOMContentLoaded; this tiny
       script just sets the attribute early. -->
  <script>
    (function () {
      try {
        var stored = window.localStorage.getItem('mg.theme');
        var initial = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', initial);
      } catch (e) { /* localStorage blocked — fall back to default light */ }
    })();
  </script>
</head>
<body>
  <header>
    <button
      type="button"
      id="mobile-back-btn"
      class="mobile-back-btn"
      aria-label="Back to home"
      hidden
    >←</button>
    <button
      type="button"
      id="search-icon-btn"
      class="search-icon-btn"
      aria-label="Open meme template search"
      aria-controls="meme-search"
      aria-expanded="false"
    >🔍</button>
    <h1 class="app-title">
      <img src="assets/mememaxxing-logo.png" alt="MemeMaxxing" class="app-logo">
    </h1>
    <!-- Desktop AI mode toggle (#87). Tap to swap the right-side template
         library for the AI suggestions form + results, in place; the canvas
         stays on the left. Desktop-only — hidden under 769px (AI is
         desktop-only in this version). -->
    <button
      type="button"
      id="ai-mode-toggle"
      class="ai-mode-toggle"
      aria-pressed="false"
      title="Switch to AI suggestion mode"
    >AI Mode: OFF</button>
    <!-- Theme toggle (#89). Pill-shaped switch with ☀️ and 🌙; clicking
         slides the thumb between them and flips the data-theme attribute
         on <html>. Persisted in localStorage. -->
    <button
      type="button"
      id="theme-toggle"
      class="theme-toggle"
      aria-label="Toggle dark mode"
      aria-pressed="false"
      title="Toggle dark mode"
    >
      <span class="theme-toggle-track" aria-hidden="true">
        <span class="theme-toggle-icon theme-toggle-icon--light">☀️</span>
        <span class="theme-toggle-icon theme-toggle-icon--dark">🌙</span>
        <span class="theme-toggle-thumb"></span>
      </span>
    </button>
  </header>

  <main>
    <div class="editor-panel">
      <div class="controls">
        <div class="controls-left">
          <!-- Font picker: pill in the controls row's left column.
               Opens a dropdown of fonts; choosing one sets the font for every
               text box, current and future (app.js wiring). -->
          <div class="font-settings" id="font-settings">
            <button
              type="button"
              id="font-settings-btn"
              class="font-settings-btn"
              aria-label="Choose a font"
              aria-haspopup="true"
              aria-expanded="false"
            >Font</button>
          </div>
        </div>
        <div class="controls-center">
          <label class="upload-btn">
            Upload
            <input type="file" id="image-input" accept="image/*" hidden>
          </label>
          <button id="download-btn" disabled>Download</button>
        </div>
        <div class="controls-right" aria-hidden="true"></div>
      </div>

      <div id="canvas-container" class="canvas-container">
        <div class="canvas-frame">
          <canvas id="meme-canvas"></canvas>
          <div class="placeholder" id="placeholder">Click here or drag &amp; drop an image to get started</div>
        </div>
        <!-- Copy-to-clipboard button. Lives inside #canvas-container so it
             positions to the canvas area top-right. Disabled until an
             image is loaded (matches Download / Share). -->
        <button
          type="button"
          id="copy-btn"
          class="copy-btn"
          aria-label="Copy meme to clipboard"
          title="Copy meme"
          disabled
        ><img src="assets/copy-icon.png" alt="" width="27" height="27" draggable="false"></button>
      </div>

      <!-- Mobile-only Fonts row — sits below canvas on mobile, invisible on desktop.
           The shared #font-settings-menu lives here so CSS can anchor it directly
           below the Fonts button with position:absolute on mobile. On desktop,
           JS repositions the menu with position:fixed + getBoundingClientRect. -->
      <div class="mobile-fonts-row">
        <button type="button" id="mobile-fonts-btn" class="fonts-btn"
          aria-haspopup="true" aria-expanded="false">Fonts</button>
        <ul
          id="font-settings-menu"
          class="font-settings-menu"
          role="menu"
          aria-label="Choose a font"
          hidden
        ></ul>
      </div>

      <p class="hint" id="hint" hidden>Click on the image to add text</p>

      <!-- Scan Text — runs client-side OCR (Tesseract.js) on the loaded image
           and drops an editable text box over each detected caption, erasing
           the original baked-in text behind a background-matched blend.
           Disabled until an image is loaded (matches Download/Share). -->
      <div class="scan-text-row">
        <button type="button" id="scan-text-btn" disabled>Scan Text</button>
      </div>

      <section id="editor-library-preview" class="editor-library-preview" aria-label="Meme library">
        <input
          type="text"
          id="editor-library-search-input"
          class="editor-library-search-input"
          placeholder="Search memes…"
          autocomplete="off"
        >
        <div id="editor-library-results" class="editor-library-results"></div>
      </section>

      <div class="bottom-actions">
        <button type="button" id="browse-memes-btn" class="browse-memes-btn">Browse Memes</button>
        <button type="button" id="share-btn" disabled>Share</button>
      </div>
    </div>

    <div class="resizer" id="panel-resizer"></div>

    <section class="meme-search" id="meme-search" aria-label="Meme search">
      <div class="meme-search-header">
        <button
          type="button"
          id="mobile-home-back-btn"
          class="mobile-home-back-btn"
          aria-label="Close browse memes"
          hidden
        >←</button>
        <h1 class="app-title">
          <img src="assets/mememaxxing-logo.png" alt="MemeMaxxing" class="app-logo">
        </h1>
      </div>

      <input
        type="text"
        id="meme-search-input"
        class="meme-search-input"
        placeholder="Search"
        autocomplete="off"
      >

      <p id="meme-search-status" class="meme-search-status" role="status" aria-live="polite"></p>
      <div id="meme-search-results" class="meme-search-results"></div>

      <button
        type="button"
        id="mobile-home-plus-btn"
        class="mobile-home-plus-btn"
        aria-label="Upload an image"
      >+</button>

      <!-- Desktop AI panel. Lives inside .meme-search so the AI-Mode toggle
           (#87) can swap it in for the library content: body.ai-mode reveals
           it inline in the right panel, in place of the template library.
           Keeps its desktop-ai-* IDs so AISuggestions.init wires it directly. -->
      <section
        id="desktop-ai-suggestions-panel"
        class="ai-suggestions-panel desktop-ai-panel"
        aria-label="Desktop AI meme suggestions"
        hidden
      >
        <header class="ai-suggestions-header">
          <h2 class="ai-suggestions-title">🐼 AI meme suggestions</h2>
          <button
            type="button"
            id="desktop-ai-close-btn"
            class="ai-close-btn"
            aria-label="Close AI suggestions"
          >×</button>
        </header>

        <div id="desktop-ai-form" class="ai-form">
          <label class="ai-field">
            <span class="ai-label">I am…</span>
            <input
              id="desktop-ai-identity"
              class="ai-input"
              placeholder="e.g. a college student"
              autocomplete="off"
            >
          </label>

          <label class="ai-field">
            <span class="ai-label">My situation…</span>
            <input
              id="desktop-ai-situation"
              class="ai-input"
              placeholder="e.g. struggling to study for finals"
              autocomplete="off"
            >
          </label>

          <button type="button" id="desktop-ai-generate-btn" class="ai-generate-btn">Generate</button>
          <hr id="desktop-ai-divider" class="ai-divider">
          <a href="#" id="desktop-ai-change-key" class="ai-change-key" hidden>Change API key</a>
        </div>


        <div id="desktop-ai-key-form" class="ai-key-form" hidden>
          <label class="ai-field">
            <span class="ai-label">Gemini API key</span>
            <input
              id="desktop-ai-key-input"
              type="password"
              class="ai-input"
              placeholder="Paste your Gemini API key"
              autocomplete="off"
            >
          </label>

          <button type="button" id="desktop-ai-key-save-btn" class="ai-generate-btn">Save key</button>

          <p class="ai-note">
            Your key is stored only on your device (localStorage). Get a free key at
            <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a>.
          </p>
        </div>

        <p id="desktop-ai-status" class="ai-status" role="status" aria-live="polite"></p>
        <div id="desktop-ai-results" class="ai-results"></div>
      </section>
    </section>
  </main>
  <!-- Tesseract.js (client-side WASM OCR) powers Scan Text. Loaded from CDN so
       it stays a zero-build, no-npm-dependency static site. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="js/ThemeToggle.js"></script>
  <script src="js/LayoutManager.js"></script>
  <script src="js/ImageLoader.js"></script>
  <script src="js/FileValidator.js"></script>
  <script src="js/Inpaint.js"></script>
  <script src="js/TextBox.js"></script>
  <script src="js/DragResize.js"></script>
  <script src="js/TextBoxManager.js"></script>
  <script src="js/Exporter.js"></script>
  <script src="js/TextRecognizer.js"></script>
  <script src="js/MemeSearch.js"></script>
  <script src="js/GeminiClient.js"></script>
  <script src="js/AISuggestions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
