<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meme Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Luckiest+Guy&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <!-- Legacy header back button — kept in DOM so existing test selectors
         don't break, but hidden permanently on mobile (the editor IS the
         default mobile view now, so there is no editor-back direction). -->
    <button
      type="button"
      id="mobile-back-btn"
      class="mobile-back-btn"
      aria-label="Back to home"
      hidden
    >←</button>
    <button
      type="button"
      id="search-icon-btn"
      class="search-icon-btn"
      aria-label="Open meme template search"
      aria-controls="meme-search"
      aria-expanded="false"
    >🔍</button>
    <h1>Meme Generator</h1>
    <!-- Settings gear (Screen 13). Inert in this version; behavior TBD. -->
    <button
      type="button"
      id="settings-btn"
      class="settings-btn"
      aria-label="Settings (coming soon)"
      aria-disabled="true"
      title="Settings coming soon"
    >⚙</button>
  </header>

<main>
    <div class="editor-panel">
      <div class="controls">
        <label class="upload-btn">
          Upload
          <input type="file" id="image-input" accept="image/*" hidden>
        </label>
        <button id="download-btn" disabled>Download Meme</button>
        <!-- Font settings: gear opens a dropdown of fonts; choosing one sets
             the font for every text box, current and future (app.js wiring). -->
        <div class="font-settings" id="font-settings">
          <button
            type="button"
            id="font-settings-btn"
            class="font-settings-btn"
            aria-label="Font settings"
            aria-haspopup="true"
            aria-expanded="false"
          >⚙</button>
          <ul
            id="font-settings-menu"
            class="font-settings-menu"
            role="menu"
            aria-label="Choose a font"
            hidden
          ></ul>
        </div>
      </div>

      <div id="canvas-container" class="canvas-container">
        <div class="canvas-frame">
          <canvas id="meme-canvas"></canvas>
          <div class="placeholder" id="placeholder">Click here or drag &amp; drop an image to get started</div>
        </div>
        <!-- Copy-to-clipboard button. Lives inside #canvas-container so it
             positions to the canvas area top-right. Disabled until an
             image is loaded (matches Download / Share). -->
        <button
          type="button"
          id="copy-btn"
          class="copy-btn"
          aria-label="Copy meme to clipboard"
          title="Copy meme"
          disabled
        ><img src="assets/copy-icon.png" alt="" width="27" height="27" draggable="false"></button>
      </div>

      <div class="fonts-row">
        <button type="button" id="fonts-btn" class="fonts-btn">fonts</button>
      </div>

      <div class="scan-text-row">
        <button
          type="button"
          id="scan-text-btn"
          disabled
          aria-disabled="true"
          title="Scan Text coming soon"
        >Scan Text</button>
      </div>

      <p class="hint" id="hint" hidden>Click on the image to add text</p>

      <section id="editor-library-preview" class="editor-library-preview" aria-label="Meme library">
        <input
          type="text"
          id="editor-library-search-input"
          class="editor-library-search-input"
          placeholder="Search memes…"
          autocomplete="off"
        >
        <div id="editor-library-results" class="editor-library-results"></div>
      </section>

      <div class="bottom-actions">
        <button type="button" id="browse-memes-btn" class="browse-memes-btn">Browse Memes</button>
        <button type="button" id="share-btn" disabled>Share</button>
      </div>
    </div>

    <div class="resizer" id="panel-resizer"></div>

    <section class="meme-search" id="meme-search" aria-label="Meme search">
      <div class="meme-search-header">
        <button
          type="button"
          id="mobile-home-back-btn"
          class="mobile-home-back-btn"
          aria-label="Close browse memes"
          hidden
        >←</button>
        <h2 class="meme-search-title">Meme Generator</h2>
      </div>
      <input
        type="text"
        id="meme-search-input"
        class="meme-search-input"
        placeholder="Search"
        autocomplete="off"
      >
      <p id="meme-search-status" class="meme-search-status" role="status" aria-live="polite"></p>
      <div id="meme-search-results" class="meme-search-results"></div>
      <button
        type="button"
        id="mobile-home-plus-btn"
        class="mobile-home-plus-btn"
        aria-label="Upload an image"
      >+</button>
      <button
        type="button"
        id="ai-panda-btn"
        class="ai-panda-btn"
        aria-label="Get AI meme suggestions"
        aria-controls="ai-suggestions-panel"
        aria-expanded="false"
        title="Get AI meme suggestions"
      >🐼</button>
    </section>

    <!-- AI suggestions panel — opened by the 🐼 button in the meme-search
         section. Hidden by default; app.js toggles visibility. -->
    <section id="ai-suggestions-panel" class="ai-suggestions-panel" aria-label="AI meme suggestions" hidden>
      <header class="ai-suggestions-header">
        <h2 class="ai-suggestions-title">🐼 AI meme suggestions</h2>
        <button type="button" id="ai-close-btn" class="ai-close-btn" aria-label="Close AI suggestions">×</button>
      </header>

      <div id="ai-form" class="ai-form">
        <label class="ai-field">
          <span class="ai-label">I am…</span>
          <input id="ai-identity" class="ai-input" placeholder="e.g. a college student" autocomplete="off">
        </label>
        <label class="ai-field">
          <span class="ai-label">My situation…</span>
          <input id="ai-situation" class="ai-input" placeholder="e.g. struggling to study for finals" autocomplete="off">
        </label>
        <button type="button" id="ai-generate-btn" class="ai-generate-btn">Generate</button>
        <a href="#" id="ai-change-key" class="ai-change-key" hidden>Change API key</a>
      </div>

      <div id="ai-key-form" class="ai-key-form" hidden>
        <label class="ai-field">
          <span class="ai-label">Gemini API key</span>
          <input id="ai-key-input" type="password" class="ai-input" placeholder="Paste your Gemini API key" autocomplete="off">
        </label>
        <button type="button" id="ai-key-save-btn" class="ai-generate-btn">Save key</button>
        <p class="ai-note">Your key is stored only on your device (localStorage). Get a free key at <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a>.</p>
      </div>

      <p id="ai-status" class="ai-status" role="status" aria-live="polite"></p>
      <div id="ai-results" class="ai-results"></div>
    </section>
  </main>
  <script src="js/LayoutManager.js"></script>
  <script src="js/ImageLoader.js"></script>
  <script src="js/TextBox.js"></script>
  <script src="js/DragResize.js"></script>
  <script src="js/TextBoxManager.js"></script>
  <script src="js/Exporter.js"></script>
  <script src="js/MemeSearch.js"></script>
  <script src="js/GeminiClient.js"></script>
  <script src="js/AISuggestions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
