name: CI

on:
  # Skip the pipeline for documentation-only changes: a PR/push is ignored only
  # when EVERY changed file matches a pattern below, so mixed docs+code changes
  # still run. `main` has no required status checks, so skipped docs-only PRs are
  # not blocked from merging. (If a required check is added later, switch to a
  # path-filter guard job that always reports.)
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - 'meeting-notes/**'
      - 'research/**'
      - 'assets/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - 'meeting-notes/**'
      - 'research/**'
      - 'assets/**'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Add ESLint problem matcher
        run: echo "::add-matcher::.github/eslint-problem-matcher.json"

      - name: Run ESLint
        id: eslint
        run: npm run lint

      - name: Notify testers of lint failures
        if: failure() && steps.eslint.outcome == 'failure'
        run: |
          echo "## Linting Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ESLint found syntax errors or style violations in \`meme-app/js/\`. Review the annotations above, fix all reported issues, and re-push before merging." >> $GITHUB_STEP_SUMMARY
          echo "::error::ESLint found violations — fix all syntax errors and style rule violations before merging."

      - name: Run tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e
